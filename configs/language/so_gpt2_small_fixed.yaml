run_name: stackoverflow_gpt2_small_fixed_dp
seed: 0
output_dir: runs/stackoverflow/gpt2_small/fixed_dp

modality: gpt2
dataset:
  name: stackoverflow
  data_root: ./data/stackoverflow_subset
  seq_len: 128
  max_users: 2000
  max_posts_per_client: 200

model:
  name: gpt2-small
  use_lora: false

server:
  rounds: 200
  sample_fraction: 0.05
  sampling: poisson
  eval_every: 25
  save_update_trace: true

local:
  epochs: 1
  lr: 5.0e-5
  weight_decay: 0.01
  batch_size: 4
  max_steps: 50

mechanism:
  name: fixed_noise
  clip_norm: 1.0
  noise_multiplier: 1.0
  expected_participants: 100.0

analysis:
  trace_proj_dim: 8192
  trace_max_samples: 256

attacks:
  canary:
    enabled: true
    num_canaries: 100
    repeats: 4
    suffix_len: 6
    max_new_tokens: 24
    exposure_subset: 20
    candidate_set_size: 1024
