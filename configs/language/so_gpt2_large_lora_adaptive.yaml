seed: 0
modality: gpt2
dataset:
  name: stackoverflow
  data_root: ./data/stackoverflow_subset
  seq_len: 128
  max_users: 2000
  max_posts_per_client: 200
model:
  name: gpt2-large
  use_lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
server:
  rounds: 200
  sample_fraction: 0.05
  sampling: poisson
  eval_every: 25
  save_update_trace: true
local:
  epochs: 1
  lr: 5.0e-05
  weight_decay: 0.01
  batch_size: 4
  max_steps: 30
analysis:
  trace_proj_dim: 8192
  trace_max_samples: 256
attacks:
  mia:
    enabled: true
  canary:
    enabled: true
    num_canaries: 100
    repeats: 4
    suffix_len: 6
    max_new_tokens: 24
    exposure_subset: 20
    candidate_set_size: 1024
mechanism:
  name: adaptive_clip
  init_clip_norm: 1.0
  target_quantile: 0.5
  lr_clip: 0.2
  noise_multiplier: 1.0
  expected_participants: 100.0
  quantile_noise_frac: 0.05
run_name: stackoverflow_gpt2_large_lora_adaptive
output_dir: runs/stackoverflow/gpt2_large_lora/adaptive
