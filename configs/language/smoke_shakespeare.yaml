run_name: smoke_shakespeare_charlstm
seed: 0
output_dir: runs/smoke_shakespeare

modality: charlm
dataset:
  name: shakespeare
  data_root: ./data/shakespeare
  seq_len: 80
  max_users: 50

model:
  name: char_lstm
  embed_dim: 8
  hidden_dim: 256
  num_layers: 2

server:
  rounds: 20
  sample_fraction: 0.2
  sampling: uniform
  eval_every: 5
  save_update_trace: true

local:
  epochs: 1
  lr: 1.0
  momentum: 0.0
  batch_size: 16
  max_steps: 20

mechanism:
  name: nonprivate
  clip_norm: 5.0

analysis:
  trace_proj_dim: 2048
  trace_max_samples: 128

attacks:
  mia:
    enabled: false
