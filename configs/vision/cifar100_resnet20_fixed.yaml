# CIFAR-100 / ResNet-20 / fixed-noise DP baseline.
# Noise multiplier should be chosen to achieve a target (eps, delta) at the
# smallest model; scripts/calibrate_noise.py does this once per ladder and
# writes the chosen sigma back into the config.
run_name: cifar100_resnet20_fixed_dp
seed: 0
output_dir: runs/cifar100/resnet20/fixed_dp

modality: vision
dataset:
  name: cifar100
  data_root: ./data
  partition: dirichlet
  alpha: 0.1
  num_clients: 100
  augment: true

model:
  name: resnet20
  num_classes: 100

server:
  rounds: 500
  sample_fraction: 0.1
  sampling: poisson
  eval_every: 25
  save_update_trace: true

local:
  epochs: 5
  lr: 0.05
  momentum: 0.9
  batch_size: 32

mechanism:
  name: fixed_noise
  clip_norm: 1.0
  noise_multiplier: 1.0   # placeholder; overridden by calibration script
  expected_participants: 10.0

analysis:
  trace_proj_dim: 8192
  trace_max_samples: 512

attacks:
  mia:
    enabled: true
    n_members: 2048
    n_nonmembers: 2048
