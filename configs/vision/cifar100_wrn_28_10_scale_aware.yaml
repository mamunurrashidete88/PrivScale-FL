run_name: cifar100_wrn28_10_scale_aware
seed: 0
output_dir: runs/cifar100/wrn_28_10/scale_aware

modality: vision
dataset:
  name: cifar100
  data_root: ./data
  partition: dirichlet
  alpha: 0.1
  num_clients: 100
  augment: true

model:
  name: wrn_28_10
  num_classes: 100
  dropout: 0.3

server:
  rounds: 500
  sample_fraction: 0.1
  sampling: poisson
  eval_every: 25
  save_update_trace: true

local:
  epochs: 5
  lr: 0.03
  momentum: 0.9
  batch_size: 32

mechanism:
  name: scale_aware
  clip_norm: 1.0
  reference_sigma: 1.0       # carried forward from smallest-model calibration
  reference_dim: 217           # placeholder; set by calibration script
  effective_dim: 1162           # placeholder; set by pilot spectral estimate
  expected_participants: 10.0

analysis:
  trace_proj_dim: 16384
  trace_max_samples: 512

attacks:
  mia:
    enabled: true
    n_members: 2048
    n_nonmembers: 2048
