run_name: cifar100_resnet44_scale_aware
seed: 0
output_dir: runs/cifar100/resnet44/scale_aware

modality: vision
dataset:
  name: cifar100
  data_root: ./data
  partition: dirichlet
  alpha: 0.1
  num_clients: 100
  augment: true

model:
  name: resnet44
  num_classes: 100

server:
  rounds: 500
  sample_fraction: 0.1
  sampling: poisson
  eval_every: 25
  save_update_trace: true

local:
  epochs: 5
  lr: 0.05
  momentum: 0.9
  batch_size: 32

mechanism:
  name: scale_aware
  clip_norm: 1.0
  reference_sigma: 1.0
  reference_dim: 217
  effective_dim: 397
  expected_participants: 10.0

analysis:
  trace_proj_dim: 12288
  trace_max_samples: 512

attacks:
  mia:
    enabled: true
    n_members: 2048
    n_nonmembers: 2048
